/* ================= tron.css ================= */
/* Amalgam neon layer. Everything here is scoped to html.tron, so removing one class returns the
   app exactly to what it was. No new hues: the existing red, amber and green do the work, and the
   depth comes from bloom, a receding grid and lit edges. Built for a phone, so no backdrop-filter
   and no per-element blur filters, which are the two things that melt mobile GPUs. */

html.tron{
  --ink:#040507;        /* deeper than the base black, so the glow has somewhere to fall off to */
  --red:#ff3b3b;
  --amber:#f2b441;
  --green:#2fd47a;
  --cool:#5b8cff;
  --edge:#1a2230;
  --bloom-tight:0 0 4px;
  --bloom-wide:0 0 18px;
}
html.tron body{background:var(--ink)}

/* ---- backdrop: canvas grid sits behind everything, then scanlines, then a vignette ---- */
/* width and height are not optional here. A canvas is a replaced element, so with width:auto
   it keeps its intrinsic 300x150 and simply ignores right and bottom. */
#tron-grid{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none;display:block}
html:not(.tron) #tron-grid{display:none}
html.tron #app{position:relative;z-index:1}
html.tron body::after{
  content:"";position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom, rgba(255,255,255,.028) 0 1px, transparent 1px 3px),
    radial-gradient(130% 90% at 50% 8%, transparent 38%, rgba(0,0,0,.62) 100%);
}
/* On a wide window the app is a 430px column and the grid is most of what you see, so the
   vignette pulls back and the darkening concentrates behind the column instead. */
@media (min-width:900px){
  html.tron body::after{
    background:
      repeating-linear-gradient(to bottom, rgba(255,255,255,.02) 0 1px, transparent 1px 3px),
      radial-gradient(60% 100% at 50% 50%, transparent 0%, transparent 55%, rgba(0,0,0,.45) 100%);
  }
  /* the column is a lit object standing on the grid, not a dim hole cut out of it */
  html.tron #app{
    background:#05070b;
    box-shadow:0 0 0 1px #ff3b3b33, 0 0 40px #000, 0 0 90px #ff3b3b14, inset 0 1px 0 #ffffff0a;
  }
  html.tron #app::before,html.tron #app::after{
    content:"";position:absolute;top:0;bottom:0;width:2px;
    background:linear-gradient(180deg,transparent,#ff3b3b 14%,#ff3b3b66 58%,transparent);
    box-shadow:0 0 14px #ff3b3b99;
  }
  html.tron #app::before{left:-14px}
  html.tron #app::after{right:-14px}
}

/* ---- type: geometric, wider tracking on labels, tabular figures everywhere it matters ---- */
html.tron body{font-family:"Eurostile","Bahnschrift","DIN Alternate",ui-sans-serif,system-ui,sans-serif}
html.tron .sec,html.tron .gl,html.tron .tl2,html.tron .st,html.tron .th{letter-spacing:.26em}
html.tron .gv,html.tron .dbig,html.tron .tv{font-variant-numeric:tabular-nums}

/* ---- the wordmark: layered bloom, and a flicker slow enough not to annoy ---- */
html.tron .wm{
  color:#fff;
  text-shadow:0 0 2px #fff, var(--bloom-tight) var(--red), 0 0 14px var(--red), 0 0 34px #ff3b3b88;
  animation:tron-flicker 7s infinite steps(1);
}
@keyframes tron-flicker{0%,97%,100%{opacity:1}97.6%{opacity:.72}98.2%{opacity:1}98.8%{opacity:.85}}

/* ---- the cockpit block: lit rim, dark well, a light bar running the top edge ---- */
html.tron .cl{
  background:linear-gradient(180deg,#0a0c11 0%,#06070a 60%);
  border-color:#6a2126;
  box-shadow:inset 0 0 30px #ff3b3b14, 0 0 0 1px #ff3b3b22, 0 0 26px #ff3b3b10;
  position:relative;overflow:hidden;
}
html.tron .cl::before{
  content:"";position:absolute;top:0;left:0;height:1px;width:38%;
  background:linear-gradient(90deg,transparent,var(--red),transparent);
  box-shadow:0 0 10px var(--red);
  animation:tron-sweep 6s linear infinite;
}
@keyframes tron-sweep{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}

/* ---- gauges: the big number is the light source ---- */
html.tron .gg{border-top-color:#212b3a}
html.tron .gg .gv{text-shadow:0 0 1px currentColor, 0 0 12px currentColor, 0 0 30px rgba(255,255,255,.07)}
html.tron .gg .gs{text-shadow:0 0 10px currentColor}
html.tron .mast{
  background:#070a0e;border-color:#4a1b1f;
  box-shadow:inset 0 1px 0 #ffffff0d, 0 0 14px #ff3b3b0f;
}
html.tron .mast .mt{text-shadow:0 0 12px currentColor}
html.tron .mast .lm i{box-shadow:0 0 8px currentColor, inset 0 0 6px #00000080}

/* ---- pick cards: lightcycle ribbons. notched corners, lit rim, the PICK card brighter ---- */
html.tron .pk{
  position:relative;
  background:linear-gradient(180deg,#0b0e13,#06080b);
  border:1px solid #2b3647;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  box-shadow:inset 0 1px 0 #ffffff0e;
  transition:box-shadow .18s ease, border-color .18s ease;
}
html.tron .pk::after{
  content:"";position:absolute;left:0;top:9px;bottom:0;width:2px;
  background:linear-gradient(180deg,transparent,#2b3647,transparent);
}
html.tron .pk:has(.pickr){
  border-color:var(--red);
  box-shadow:inset 0 1px 0 #ffffff14, 0 0 0 1px #ff3b3b40, 0 0 22px #ff3b3b33;
}
html.tron .pk:has(.pickr)::after{background:linear-gradient(180deg,transparent,var(--red),transparent);box-shadow:0 0 10px var(--red)}
html.tron .pk .role{text-shadow:0 0 10px currentColor}
html.tron .pk .ps{text-shadow:0 0 12px currentColor}
html.tron .dot.on{box-shadow:0 0 8px currentColor}

/* ---- buttons: thin ribbon, glow on contact ---- */
html.tron .bt{
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  transition:box-shadow .15s ease, transform .08s ease;
}
html.tron .bt:active{transform:translateY(1px)}
/* Only the outlined buttons get the dark well. BUY is a filled slab in the app, green with
   near-black type, so a blanket dark background here made the most important button in the
   whole app unreadable. It stays filled, and gets brighter rather than darker. */
html.tron .bt.skip,html.tron .bt.dim{background:#080b10}
html.tron .bt.buy{
  background:linear-gradient(180deg,#4ae996,#21b866);
  color:#03050a;border-color:#7df6b8;
  box-shadow:0 0 20px #2fd47a99, inset 0 1px 0 #ffffff66;
}
html.tron .bt.skip{box-shadow:inset 0 0 14px #ff3b3b1a, 0 0 12px #ff3b3b33}
html.tron .bt.on{box-shadow:0 0 0 2px #fff, 0 0 26px currentColor}
html.tron .chip{box-shadow:0 0 10px #f2b44122, inset 0 0 10px #f2b4410f;text-shadow:0 0 8px currentColor}

/* ---- sheets and panels: a lit top edge, deeper well ---- */
html.tron .sheet{
  background:linear-gradient(180deg,#0a0d12,#05070a 40%);
  border-top:1px solid var(--red);
  box-shadow:0 -1px 26px #ff3b3b2e;
}
html.tron .scrim{background:#000000cc}
html.tron .sn{text-shadow:0 0 12px var(--red)}
html.tron .cp,html.tron .hp-note{border-style:solid;border-color:#243044;background:#070a0e99}
html.tron .th{text-shadow:0 0 10px currentColor}

/* ---- the HUD svg: let the strokes bloom ---- */
html.tron .hud svg{filter:drop-shadow(0 0 3px rgba(255,59,59,.45))}
html.tron .tug{background:#070a0e;border-color:#3f171b;box-shadow:inset 0 0 18px #ff3b3b0d}
html.tron .tug svg{filter:drop-shadow(0 0 2px rgba(242,180,65,.4))}

/* ---- someone who asked for less motion gets none of it ---- */
@media (prefers-reduced-motion:reduce){
  html.tron .wm{animation:none}
  html.tron .cl::before{animation:none;opacity:.5}
}

/* ---- arrival: the view flies in from the vanishing point once, then sits flat ----
   The 3D lives in the entrance, not in the resting state. Text that stays transformed gets
   rasterised on a composited layer and goes soft, and raked tap targets on a phone are a real
   cost in accuracy. So every element lands on transform:none and reads like plain type. */
html.tron #app{perspective:1100px;perspective-origin:50% 0%}
@keyframes tron-arrive{
  from{opacity:0;transform:translate3d(0,54px,-420px) rotateX(16deg)}
  60%{opacity:1}
  to{opacity:1;transform:none}
}
html.tron .cl,html.tron .chiprow,html.tron .cards>.pk,html.tron .hd,html.tron .hp-note,html.tron .sc7{
  animation:tron-arrive .72s cubic-bezier(.16,.84,.3,1) both;
  transform-origin:50% 100%;
}
html.tron .top{animation:tron-arrive .6s cubic-bezier(.16,.84,.3,1) both}
html.tron .chiprow{animation-delay:.06s}
html.tron .cl{animation-delay:.12s}
html.tron .hd{animation-delay:.2s}
html.tron .cards>.pk:nth-child(1){animation-delay:.26s}
html.tron .cards>.pk:nth-child(2){animation-delay:.32s}
html.tron .cards>.pk:nth-child(3){animation-delay:.38s}
html.tron .hp-note{animation-delay:.44s}
/* the sheets fly up off the grid when they open */
@keyframes tron-sheet{from{opacity:0;transform:translate3d(0,80px,-300px)}to{opacity:1;transform:none}}
html.tron .sheet{animation:tron-sheet .34s cubic-bezier(.16,.84,.3,1) both}

/* ---- raked chrome: the geometry is slanted, the words are not ---- */
html.tron .hd{position:relative}
html.tron .hd::after{
  content:"";position:absolute;left:16px;right:16px;bottom:-5px;height:1px;
  background:linear-gradient(90deg,#ff3b3b88,transparent 62%);
  transform:skewY(-.9deg);box-shadow:0 0 8px #ff3b3b55;
}
html.tron .sec{position:relative}
html.tron .sec::before{
  content:"";position:absolute;left:-10px;top:2px;bottom:2px;width:3px;
  background:var(--red);box-shadow:0 0 10px var(--red);transform:skewY(-8deg);
}

/* ---- canopy: raked frame edges, top and bottom, so the screen reads as a windshield ---- */
html.tron body::before{
  content:"";position:fixed;left:0;right:0;top:0;height:46px;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,#000 0%,#000000cc 42%,transparent 100%);
  clip-path:polygon(0 0,100% 0,100% 58%,0 100%);
  border-bottom:0;
}
html.tron #tron-canopy{
  position:fixed;left:0;right:0;top:0;height:48px;z-index:4;pointer-events:none;
  background:linear-gradient(180deg,transparent 60%,#ff3b3b 98%,transparent);
  clip-path:polygon(0 0,100% 0,100% 58%,0 100%);opacity:.55;
}

/* a phone has no room to spare, so the frame is edge only and the grid keeps the middle */
@media (max-width:899px){
  html.tron #app{background:transparent}
  html.tron .cl{background:linear-gradient(180deg,#0a0c11f2,#06070af2)}
  html.tron .pk{background:linear-gradient(180deg,#0b0e13f2,#06080bf2)}
}

@media (prefers-reduced-motion:reduce){
  html.tron .cl,html.tron .chiprow,html.tron .cards>.pk,html.tron .hd,html.tron .hp-note,
  html.tron .sc7,html.tron .top,html.tron .sheet{animation:none}
}

/* ================= wide.css ================= */
/* Wide-screen layer. Every rule sits inside a min-width query, so the phone is untouched.
   Pairs with tron.css but does not require it.

   Phase 1 deliberately keeps ONE column and makes it wide, rather than splitting into a grid.
   The render emits its regions as flat siblings, so a two-column grid would either couple the
   row heights of unrelated blocks or need the DOM reordered, which changes the phone. The real
   multi-pane HUD needs the panels to stop being modals anyway, and that is Phase 2 work. */

#app > .z{display:contents}          /* phone: the region wrappers vanish from layout entirely */

@media (min-width:1000px){
  #app{max-width:1080px}
  #app > .z{display:block}

  /* the cards stop being thumbnails. at 430px each card was about 130px wide, which is why
     everything interesting had to hide behind a drill-down. here they get about 330px. */
  .cards{gap:14px;padding:0 18px}
  .pk{padding-bottom:4px}
  .pk .pn{font-size:15px}
  .pk .ps{font-size:30px}
  .pk .tag{font-size:11px}
  .bt{min-height:56px;font-size:15px}

  /* the cockpit can breathe */
  .cl{margin:0 18px 12px;padding:12px 12px 6px}
  .gg .gv{font-size:42px}
  .gg .gl{font-size:12px}
  .mast .mt{font-size:16px}

  .hd{padding:0 20px}
  .hp-note,.cp{font-size:13px}

  /* panels were sized for a thumb. on a desktop they are a reading surface. */
  .sheet{max-width:860px;border-radius:18px;top:40px;bottom:40px;padding:20px 22px 24px}
  .sk{max-width:860px}
  .sc7{grid-template-columns:2fr .7fr 1fr 1fr 1fr 1fr .9fr}
  .sc7 .tl{font-size:12px}
  .sc7 .tc{font-size:14px}
}

@media (min-width:1500px){
  #app{max-width:1180px}
  .cards{gap:18px}
  .pk .ps{font-size:34px}
}

/* ================= hud.css  ================= */
/* Amalgam HUD layer. Scoped to html.tron like the neon layer, so one class still turns
   everything off. This layer is about hierarchy rather than glow: a type scale, a colour
   contract, a two-column desktop band, and the race drawn as a chart instead of a table.

   Colour contract, and the reason for it:
     red    is structure and identity. It is the chrome. It NEVER means "bad", because the
            whole frame is red and a red loss figure would disappear into it.
     green  means go, and a result better than the benchmark.
     amber  means caution, and marks the benchmark lanes you have to beat.
     slate  means a result worse than the benchmark. Cold, not alarming.
   Anything that breaks this contract is a bug, not a taste difference. */

html.tron{
  --ink0:#04060a; --ink1:#080b11; --ink2:#0c1118;
  --txt:#e6edf5; --dim:#9eacbe; --faint:#4a5768;
  --go:#2fd47a; --warn:#f2b441; --chrome:#ff3b3b; --loss:#7f93ad;

  /* one scale, seven steps. the app currently ships seventeen ad-hoc sizes. */
  --t0:10px; --t1:11px; --t2:13px; --t3:15px; --t4:20px; --t5:30px; --t6:46px;
  --trk-label:.22em; --trk-display:-.01em;
}

/* ---- labels and display share a system ---- */
html.tron .sec,html.tron .th,html.tron .st,html.tron .gl,html.tron .tag{
  letter-spacing:var(--trk-label); font-size:var(--t1); font-weight:800;
}
html.tron .gv,html.tron .ps,html.tron .dbig,html.tron .tv,html.tron .tc{
  font-variant-numeric:tabular-nums; letter-spacing:var(--trk-display);
}

/* ---- THE BUY HIERARCHY ---------------------------------------------------------------
   A filled green slab is the app telling you to act, so it has to follow the only rule the
   system can defend: whether the name cleared all three gates. It used to follow rank, which
   is decided by 20-day relative strength once the gate scores tie, and that tiebreak has no
   measured edge. On 2026-11-25 all three cards read 3 OF 3 and only the first was lit. */
html.tron .pk .bt.buy{
  background:#07100c; color:#2fd47a; border-color:#1e6b45;
  box-shadow:none; font-weight:800;
}
html.tron .pk .bt.buy:active{background:#0a1a12}
html.tron .pk.g3 .bt.buy{
  background:linear-gradient(180deg,#4ae996,#21b866);
  color:#03050a; border-color:#7df6b8;
  box-shadow:0 0 24px #2fd47a80, inset 0 1px 0 #ffffff66;
}

/* A card that cleared every gate but did not win the tiebreak is not "watch only". It gets
   its rank, in the same weight as the PICK badge rather than the dismissed grey. */
html.tron .rankr{border:1px solid #4a5768;color:#c9d1dc;background:#0d1219}

/* ---- two-column band on a real screen -----------------------------------------------
   .zgrid is display:contents on a phone, so the five regions stay direct flex children of
   #app and the phone layout is byte-identical. Above 1280 it becomes the grid. The race
   spans two rows so its height is driven by the left column, never the other way round. */
.zgrid{display:contents}

@media (min-width:1280px){
  #app{max-width:1500px}
  /* six buttons justified across 1500px read as six unrelated things. grouped, they read
     as one control strip. */
  html.tron .chiprow{justify-content:flex-start;gap:8px;flex-wrap:wrap}
  html.tron .top .wm{font-size:var(--t4);letter-spacing:.42em}

  .zgrid{
    display:grid; width:100%;
    grid-template-columns:minmax(0,1.34fr) minmax(0,1fr);
    grid-template-areas:
      "hud   race"
      "picks race"
      "meter inst"
      "sig   inst";
    column-gap:26px; align-items:start;
  }
  .z-hud{grid-area:hud} .z-picks{grid-area:picks} .z-race{grid-area:race}
  .z-meter{grid-area:meter} .z-inst{grid-area:inst} .z-sig{grid-area:sig}
  .z-race{display:block}
  /* the RACE button only makes sense where the race is not already on screen */
  .z-picks [data-act="race"]{display:none}
}
/* below 1280 the race stays behind its button, because a phone has no room for it.
   Written as a max-width query rather than a bare rule, so it cannot sit after the rule
   that reveals it and silently win on equal specificity. */
@media (max-width:1279px){ .z-race{display:none} }

/* ---- the race panel ---- */
html.tron .rc{
  margin:0 18px; background:linear-gradient(180deg,#0a0d13,#05070b 70%);
  border:1px solid #243044; border-radius:14px; padding:12px 14px 14px;
  box-shadow:inset 0 1px 0 #ffffff0d, 0 0 26px #ff3b3b10;
}
html.tron .rc-head{font-size:var(--t2);line-height:1.45;color:var(--txt);margin-bottom:2px}
html.tron .rc-head b{color:var(--warn);font-weight:800}
html.tron .rc-sub{font-size:var(--t1);color:var(--dim);letter-spacing:.04em;line-height:1.5;margin-bottom:10px}
html.tron .rc svg{display:block;width:100%;height:auto;overflow:visible}
html.tron .rc-tab{
  width:100%;border-collapse:collapse;margin-top:10px;
  font-size:var(--t1);font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
html.tron .rc-tab th{
  text-align:right;font-size:var(--t0);letter-spacing:var(--trk-label);
  color:var(--faint);font-weight:800;padding:0 0 4px;
}
html.tron .rc-tab td{text-align:right;padding:3px 0;border-top:1px solid #141c27;font-weight:800}
html.tron .rc-tab td:first-child,html.tron .rc-tab th:first-child{
  text-align:left;color:var(--dim);font-weight:800;letter-spacing:.08em;
}
html.tron .rc-tab td.nil{color:#2f3a49}
html.tron .rc-foot{
  margin-top:10px;padding-top:10px;border-top:1px solid #1a2230;
  font-size:var(--t1);color:var(--dim);line-height:1.5;letter-spacing:.03em;
}
html.tron .rc-bar{height:4px;background:#121a25;border-radius:3px;overflow:hidden;margin:7px 0}
html.tron .rc-bar i{display:block;height:100%;background:linear-gradient(90deg,#ff3b3b,#f2b441);box-shadow:0 0 10px #ff3b3b88}

/* ---- the empty state is a first-class design, not a fallback ---- */
html.tron .rc-empty{
  text-align:center;padding:10px 6px 2px;
  font-size:var(--t1);letter-spacing:var(--trk-label);color:var(--faint);font-weight:800;
}
html.tron .rc-empty b{display:block;font-size:var(--t4);letter-spacing:.1em;color:#5d6b7e;margin-bottom:6px}

@media (prefers-reduced-motion:no-preference){
  html.tron .rc-ln{stroke-dasharray:1 0;animation:rc-draw 1.1s cubic-bezier(.3,.8,.3,1) both}
  @keyframes rc-draw{from{opacity:0}to{opacity:1}}
}

/* ================= heat.css ================= */
/* ---- the heat map ----------------------------------------------------------------
   Same frame as the race panel, because they are siblings: both are the app telling
   Brent what happened, neither is the app telling him what to do. */
html.tron .ht{
  margin:0 18px; background:linear-gradient(180deg,#0a0d13,#05070b 70%);
  border:1px solid #243044; border-radius:14px; padding:12px 14px 14px;
  box-shadow:inset 0 1px 0 #ffffff0d, 0 0 26px #ff3b3b10;
}
html.tron .ht-head{font-size:var(--t2);line-height:1.45;color:var(--txt);margin-bottom:2px}
html.tron .ht-head b{color:var(--warn);font-weight:800}
html.tron .ht-sub{font-size:var(--t1);color:var(--dim);letter-spacing:.04em;line-height:1.5}
html.tron .ht-btns{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
html.tron .ht-btns .mini2.on{border-color:#ff3b3b;color:#ff3b3b}
html.tron .ht svg{display:block;width:100%;height:auto;border-radius:8px;background:#05070b}
html.tron .ht-foot{
  font-size:var(--t1);color:var(--dim);letter-spacing:.04em;line-height:1.55;margin-top:10px;
  border-top:1px solid #16202d;padding-top:9px;
}

/* The map wants width more than anything else, so on a wide screen it takes the whole
   band under the two columns rather than sharing a column with the race. */
@media (min-width:1280px){
  .zgrid{
    grid-template-areas:
      "hud   race"
      "picks race"
      "book  book"
      "vs    vs"
      "heat  heat"
      "meter inst"
      "sig   inst";
  }
  .z-book{grid-area:book;margin-top:22px}
  .z-vs{grid-area:vs;margin-top:22px}
  .z-heat{grid-area:heat;display:block;margin-top:22px}
  .z-picks [data-act="heat"]{display:none}
}
@media (max-width:1279px){ .z-heat{display:none} }

/* ---- the held book ----
   Its own class. The app already owns .hd for section header bars, where it means
   display:flex, and borrowing it laid the book's four blocks out in a row on top of
   each other. Found 2026-11-26 from a screenshot. */
html.tron .bk{
  display:block;
  margin:0 18px; background:linear-gradient(180deg,#0a0d13,#05070b 70%);
  border:1px solid #243044; border-radius:14px; padding:12px 14px 14px;
  box-shadow:inset 0 1px 0 #ffffff0d, 0 0 26px #5b8cff10;
}
html.tron .hd-head{font-size:var(--t2);line-height:1.45;color:var(--txt)}
html.tron .hd-head b{color:var(--warn);font-weight:800}
html.tron .hd-sub,html.tron .hd-foot{font-size:var(--t1);color:var(--dim);letter-spacing:.04em;line-height:1.5}
html.tron .hd-foot{margin-top:10px;border-top:1px solid #16202d;padding-top:9px}
html.tron .hd-bar{height:5px;background:#131b26;border-radius:3px;overflow:hidden;margin:9px 0 6px}
html.tron .hd-bar i{display:block;height:100%;background:linear-gradient(90deg,#5b8cff,#ff3b3b)}
html.tron .hd-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:10px 0 2px}
@media (max-width:560px){ html.tron .hd-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
html.tron .hd-t{
  border-radius:9px;padding:9px 8px;min-height:84px;display:flex;flex-direction:column;gap:2px;
  border:1px solid #05070b;
}
html.tron .hd-e{background:none;border:1px dashed #243044}
html.tron .hd-e .hd-s{color:#3a4658}
html.tron .hd-al{border-color:#ff3b3b;box-shadow:0 0 0 1px #ff3b3b, 0 0 14px #ff3b3b55}
html.tron .hd-s{font-size:12px;font-weight:800;letter-spacing:.1em;color:#f2f7fc}
html.tron .hd-r{font-size:19px;font-weight:800;color:#f2f7fc;line-height:1.1}
html.tron .hd-m{font-size:9.5px;color:#f2f7fcb0;letter-spacing:.03em;margin-top:auto}
html.tron .hd-a{font-size:9px;font-weight:800;letter-spacing:.09em;color:#ff8a8a}

html.tron .z-book .hd2{display:flex;align-items:baseline;justify-content:space-between;padding:0 18px 8px}

/* ---- You against SPY: the scoreboard ---------------------------------- */
html.tron .vs{margin:0 18px}
html.tron .vs-head{
  font-size:var(--t2);color:var(--ink);letter-spacing:.03em;line-height:1.5;margin-bottom:12px;
}
html.tron .vs-rows{display:flex;flex-direction:column;gap:11px}
html.tron .vs-r{
  display:grid;grid-template-columns:1fr 46% auto;grid-template-areas:"l b n" "s s s";
  align-items:center;column-gap:10px;row-gap:3px;
}
html.tron .vs-l{
  grid-area:l;font-size:var(--t1);color:var(--dim);letter-spacing:.12em;font-weight:800;
}
html.tron .vs-b{
  grid-area:b;position:relative;height:12px;background:#0b1118;border:1px solid #16202d;
  border-radius:3px;overflow:hidden;
}
html.tron .vs-z{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#2b3a4d}
html.tron .vs-f{position:absolute;top:0;bottom:0;border-radius:2px}
html.tron .vs-n{
  grid-area:n;font-size:var(--t2);font-weight:800;font-variant-numeric:tabular-nums;
  min-width:52px;text-align:right;
}
html.tron .vs-dim{color:var(--dim);font-weight:700}
html.tron .vs-sub{
  grid-area:s;font-size:var(--t1);color:var(--dim);letter-spacing:.03em;
  font-variant-numeric:tabular-nums;
}
html.tron .vs-warn{color:#f2b441}
html.tron .vs-foot{
  font-size:var(--t1);color:var(--dim);letter-spacing:.04em;line-height:1.55;margin-top:13px;
  border-top:1px solid #16202d;padding-top:9px;
}
html.tron .vs-stale{
  display:block;margin-top:7px;color:#f2b441;font-size:var(--t1);letter-spacing:.04em;line-height:1.5;
}

/* ---- the top bar reads over the background art ---------------------- */
html.tron .top{
  position:relative;z-index:3;
  background:linear-gradient(180deg,#05070b 55%,#05070bdd 80%,#05070b00);
  padding-bottom:14px;
}

  color:#ff3b3b;text-shadow:0 0 14px #ff3b3b66;
  -webkit-text-stroke:0;opacity:1;
}

/* A section header holds its label and up to three buttons on one line with no wrapping,
   which overflows the right edge of a 390px phone and clips the last button. Unscoped,
   because it is a fault in the app rather than in the neon layer. */
@media (max-width:560px){
  .hd{flex-wrap:wrap;row-gap:6px}
  .hd > span:last-child{margin-left:auto}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
/* Amalgam race chart.
   The race is the only part of this system that can ever prove the method works, and until
   now it was twelve numbers in a grid behind a button. This draws it.

   One rule governs the colours. Hue never encodes WHICH lane, because a reader will always
   read hue as good or bad. Identity is carried by the label at the end of each line. Hue
   carries the only thing that is actually a judgement: whether a lane is beating RANDOM.
     white  your gates, the lane you care about
     amber  RANDOM, the benchmark every lane has to clear, drawn dashed
     slate  the other two reference lanes
   and the endpoint dot takes green when that lane is ahead of RANDOM at 20 days, slate when
   it is behind. Red appears nowhere in here: red is the frame of this app, and a red loss
   figure would read as decoration. */

var RACE_LANES = {
  gates:   {name:'YOUR GATES', full:'YOUR GATES',        stroke:'#e6edf5', w:2.3, dash:''},
  mom12_1: {name:'MOMENTUM',   full:'12-MONTH MOMENTUM', stroke:'#8da2bb', w:1.6, dash:''},
  pct52w:  {name:'52W HIGH',   full:'NEAR 52-WEEK HIGH', stroke:'#8da2bb', w:1.6, dash:''},
  random:  {name:'RANDOM',     full:'RANDOM',            stroke:'#f2b441', w:1.9, dash:'5 4'}
};
var RACE_HZ = [5,10,20];

/* U+2212 MINUS, not a hyphen: it is the same width as the plus, so a column of results
   lines up instead of shuffling left by a pixel on every negative. */
function raceNum(v){ return v<0 ? '\u2212'+Math.abs(v).toFixed(2) : '+'+v.toFixed(2); }

/* Returns {html} for the whole panel. Safe on a missing, empty or partial race block. */
function raceInline(R, opts){
  opts = opts || {};
  var lanes = (R && R.lanes && R.lanes.length) ? R.lanes : ['gates','mom12_1','pct52w','random'];
  var sum   = (R && R.summary) || {};
  var done  = (R && R.closed_sessions) || 0;
  var target= (R && R.target_sessions) || 91;
  var bn    = (R && R.basket_n) || 20;

  /* a value counts only if the lane has actually closed sessions behind it */
  function val(l,k){ var s=sum[l]||{}; var v=s[k]; return (typeof v==='number' && (s.n||0)>0) ? v : null; }
  var any=false;
  lanes.forEach(function(l){ RACE_HZ.forEach(function(h){ if(val(l,'x'+h)!==null) any=true; }); });

  var W=460,H=212,L=14,Rm=150,T=16,B=30;
  var x0=L, x1=W-Rm, y0=T, y1=H-B;
  function px(d){ return x0 + (d/20)*(x1-x0); }

  var ymax=1.0;
  if(any) lanes.forEach(function(l){ RACE_HZ.forEach(function(h){
    var v=val(l,'x'+h); if(v!==null) ymax=Math.max(ymax,Math.abs(v)*1.18);
  }); });
  function py(v){ return y0 + (1 - (v+ymax)/(2*ymax))*(y1-y0); }

  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Average points ahead of SPY by holding period">';

  /* grid: the zero line is the market. everything is measured against it. */
  RACE_HZ.forEach(function(h){
    s+='<line x1="'+px(h)+'" y1="'+y0+'" x2="'+px(h)+'" y2="'+y1+'" stroke="#18212e" stroke-width="1"/>';
    s+='<text x="'+px(h)+'" y="'+(y1+17)+'" fill="#55637a" font-size="10" font-weight="800" letter-spacing="1.6" text-anchor="middle">'+h+'D</text>';
  });
  if(any){
    s+='<line x1="'+x0+'" y1="'+py(0)+'" x2="'+x1+'" y2="'+py(0)+'" stroke="#f2b44159" stroke-width="1" stroke-dasharray="2 3"/>';
    s+='<text x="'+x0+'" y="'+(py(0)-10)+'" fill="#7a6a42" font-size="9" font-weight="800" letter-spacing="1.8">SPY</text>';
  }

  if(!any){
    /* Nothing has been scored. Rather than an empty box, this is the grid before the start:
       every runner on the line, every lane stretching away to the 20-day finish. It is the
       same geometry the scored chart uses, so when the first result lands the lines simply
       begin to move instead of the panel changing shape. */
    s+='<line x1="'+x0+'" y1="'+(y0+6)+'" x2="'+x0+'" y2="'+(y1-6)+'" stroke="#ff3b3b" stroke-width="1.5" opacity=".55"/>';
    s+='<text x="'+x0+'" y="'+(y0+2)+'" fill="#8a4a4a" font-size="9" font-weight="800" letter-spacing="1.8">START</text>';
    lanes.forEach(function(l,i){
      var m=RACE_LANES[l]||{name:l,stroke:'#8da2bb',dash:''};
      var y=py(0)+(i-(lanes.length-1)/2)*15;
      s+='<line x1="'+x0+'" y1="'+y.toFixed(1)+'" x2="'+x1+'" y2="'+y.toFixed(1)+'" stroke="'+m.stroke+'" stroke-width="1" stroke-dasharray="2 5" opacity=".30"/>';
      s+='<circle cx="'+(x0+1)+'" cy="'+y.toFixed(1)+'" r="3.2" fill="'+m.stroke+'" opacity=".85"/>';
      s+='<text x="'+(x1+12)+'" y="'+(y+3).toFixed(1)+'" fill="#5b6a7e" font-size="10" font-weight="800" letter-spacing="1">'+m.name+'</text>';
    });
    s+='<line x1="'+x1+'" y1="'+(y0+6)+'" x2="'+x1+'" y2="'+(y1-6)+'" stroke="#2a3647" stroke-width="1.5"/>';
    s+='<text x="'+x1+'" y="'+(y0+2)+'" fill="#4a5768" font-size="9" font-weight="800" letter-spacing="1.8" text-anchor="end">FINISH</text>';
    s+='</svg>';
  } else {
    var rnd = val('random','x20');
    var ends=[];
    lanes.forEach(function(l){
      var m=RACE_LANES[l]||{name:l,stroke:'#8da2bb',w:1.6,dash:''};
      var pts=['0,'+py(0).toFixed(1)].map(function(){ return px(0).toFixed(1)+','+py(0).toFixed(1); });
      var last=null;
      RACE_HZ.forEach(function(h){ var v=val(l,'x'+h); if(v!==null){ pts.push(px(h).toFixed(1)+','+py(v).toFixed(1)); last={d:h,v:v}; } });
      s+='<polyline class="rc-ln" points="'+pts.join(' ')+'" fill="none" stroke="'+m.stroke+'" stroke-width="'+m.w+'"'+
         (m.dash?' stroke-dasharray="'+m.dash+'"':'')+' stroke-linejoin="round" stroke-linecap="round"'+
         '/>';
      if(last){
        var ahead = (l==='random') ? null : (rnd===null ? null : last.v>rnd);
        var c = (l==='random') ? '#f2b441' : (ahead===null ? '#8da2bb' : (ahead ? '#2fd47a' : '#7f93ad'));
        ends.push({y:py(last.v), name:m.name, v:last.v, c:c, x:px(last.d)});
      }
    });
    /* stack the end labels so two close lines do not print on top of each other */
    ends.sort(function(a,b){return a.y-b.y});
    for(var i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<13) ends[i].y=ends[i-1].y+13;
    ends.forEach(function(e){
      s+='<circle cx="'+e.x.toFixed(1)+'" cy="'+py(e.v).toFixed(1)+'" r="3.2" fill="'+e.c+'"/>';
      s+='<text x="'+(x1+10)+'" y="'+(e.y+3).toFixed(1)+'" fill="'+e.c+'" font-size="10" font-weight="800" letter-spacing="1">'+e.name+'</text>';
      s+='<text x="'+(W-2)+'" y="'+(e.y+3).toFixed(1)+'" fill="'+e.c+'" font-size="10" font-weight="800" text-anchor="end">'+raceNum(e.v)+'</text>';
    });
    s+='</svg>';
  }

  /* the app states its own finding in words, or says plainly that it has none */
  var head;
  if(!any){
    head='<b>No result yet.</b> '+done+' of about '+target+' sessions have closed. '+
         'A session is only scored once its picks have had 5, 10 and 20 trading days to run, '+
         'so the first number appears about four weeks after the first slate.';
  } else {
    var rank=lanes.filter(function(l){return val(l,'x20')!==null})
                  .sort(function(a,b){return val(b,'x20')-val(a,'x20')});
    var lead=rank[0], g=val('gates','x20'), r=val('random','x20');
    head='<b>At 20 days '+((RACE_LANES[lead]||{}).full||lead)+' leads at '+raceNum(val(lead,'x20'))+'.</b> ';
    if(g!==null && r!==null)
      head+='Your gates are at '+raceNum(g)+', '+(g>r?'ahead of':'behind')+' RANDOM at '+raceNum(r)+'. ';
    head+=(done<target? 'Too few sessions to mean anything yet.' : 'Enough sessions to look.');
  }

  var tab='';
  if(any){
    var rnd20=val('random','x20');
    tab='<table class="rc-tab"><thead><tr><th></th>'+
        RACE_HZ.map(function(h){return '<th>'+h+'D</th>'}).join('')+'</tr></thead><tbody>'+
      lanes.map(function(l){
        var m=RACE_LANES[l]||{full:l};
        return '<tr><td>'+(m.full||l)+'</td>'+RACE_HZ.map(function(h){
          var v=val(l,'x'+h);
          if(v===null) return '<td class="nil">&ndash;</td>';
          var c = (l==='random') ? '#f2b441'
                : (rnd20===null || h!==20) ? '#c9d1dc'
                : (v>rnd20 ? '#2fd47a' : '#7f93ad');
          return '<td style="color:'+c+'">'+raceNum(v)+'</td>';
        }).join('')+'</tr>';
      }).join('')+'</tbody></table>';
  }
  var pr=Math.min(100,Math.round(done/target*100));
  return '<div class="rc">'+
    '<div class="rc-head">'+head+'</div>'+
    '<div class="rc-sub">Average points ahead of SPY, by how long a pick is held. '+
      'Four ways of picking, same night, same pool, no money on any of them.</div>'+
    s+tab+
    '<div class="rc-foot">'+done+' of about '+target+' scored sessions'+
      '<div class="rc-bar"><i style="width:'+pr+'%"></i></div>'+
      'Sessions are the unit here, not picks: one session closes '+bn+' picks at once and they '+
      'are not '+bn+' independent facts. '+
      (done<target ? 'Not enough yet to mean anything. '
                   : 'Compare every lane with RANDOM, not with each other. ')+
      'The lane to watch is RANDOM. Anything that cannot beat a coin flip from the same pool '+
      'is not picking, it is guessing.</div>'+
    '</div>';
}

/* Amalgam heat map.
   Brent reads a market faster from a block of coloured tiles than from any table, so this is
   the thinkorswim view built from the data the app already publishes.

   Area is 20-day average dollar volume, so the tiles that are physically big are the ones the
   market is actually trading. Colour is the return over the chosen window, red down, green up,
   against a near-black neutral. Those are the same two colours the rest of the app uses for
   loss and gain, so a tile means here exactly what a number means elsewhere.

   The scale saturates at a cap that grows with the window (3% for a day, 12% for twenty). A
   fixed cap would make every tile look identical at one day and identical at twenty. */

var HEAT_WINS = [1, 5, 20, 60];
var HEAT_CAP  = {1:0.03, 5:0.06, 20:0.12, 60:0.25};

/* Squarified treemap (Bruls, Huizing, van Wijk 2000). Items must arrive sorted by v desc. */
function heatSquarify(items, x, y, w, h){
  var out = [];
  if(!items.length || w <= 0 || h <= 0) return out;
  var total = 0, i;
  for(i = 0; i < items.length; i++) total += items[i].v;
  if(total <= 0) return out;
  var scale = (w * h) / total, row = [], rowSum = 0, side = Math.min(w, h);
  function worst(extra){
    var mx = 0, mn = Infinity, sum = rowSum + (extra || 0), k, a;
    for(k = 0; k < row.length; k++){ a = row[k].v * scale; if(a > mx) mx = a; if(a < mn) mn = a; }
    if(extra){ a = extra * scale; if(a > mx) mx = a; if(a < mn) mn = a; }
    sum *= scale;
    if(sum <= 0 || mn <= 0 || side <= 0) return Infinity;
    return Math.max(side * side * mx / (sum * sum), sum * sum / (side * side * mn));
  }
  i = 0;
  while(i < items.length){
    if(!row.length || worst(items[i].v) <= worst(0)){
      row.push(items[i]); rowSum += items[i].v; i++;
    } else {
      var len = (rowSum * scale) / side, off = 0, k2;
      for(k2 = 0; k2 < row.length; k2++){
        var a2 = row[k2].v * scale, s2 = a2 / len;
        if(w >= h) out.push({it:row[k2], x:x, y:y + off, w:len, h:s2});
        else       out.push({it:row[k2], x:x + off, y:y, w:s2, h:len});
        off += s2;
      }
      if(w >= h){ x += len; w -= len; } else { y += len; h -= len; }
      side = Math.min(w, h); row = []; rowSum = 0;
    }
  }
  if(row.length && rowSum > 0){
    var off2 = 0, full = (w >= h) ? h : w, k3;
    for(k3 = 0; k3 < row.length; k3++){
      var sz = full * (row[k3].v / rowSum);
      if(w >= h) out.push({it:row[k3], x:x, y:y + off2, w:w, h:sz});
      else       out.push({it:row[k3], x:x + off2, y:y, w:sz, h:h});
      off2 += sz;
    }
  }
  return out;
}

/* Close-to-close return over `win` sessions, and the 20-day average dollar volume. */
function heatStat(bars, win){
  if(!bars || bars.length < win + 1) return null;
  var n = bars.length, last = bars[n - 1], prev = bars[n - 1 - win];
  if(!last || !prev || !prev[4] || !last[4]) return null;
  var dv = 0, k = 0, i;
  for(i = Math.max(0, n - 20); i < n; i++){ dv += bars[i][4] * bars[i][5]; k++; }
  return { c:last[4], r:last[4] / prev[4] - 1, dv:k ? dv / k : 0 };
}

function heatColor(r, cap){
  var t = Math.max(-1, Math.min(1, r / cap));
  var tgt = t >= 0 ? [47, 212, 122] : [255, 59, 59];
  var a = Math.pow(Math.abs(t), 0.62);          /* small moves still read, instead of all black */
  var c = [0, 1, 2].map(function(i){ return Math.round(26 + (tgt[i] - 26) * a); });
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}

function heatPct(r){
  var s = (r * 100).toFixed(Math.abs(r) < 0.1 ? 1 : 0);
  return (r < 0 ? '−' + s.replace('-', '') : '+' + s) + '%';
}

/* Returns the whole panel. Safe on missing or short data. */
function heatInline(M, win){
  win = win || 20;
  var cap = HEAT_CAP[win] || 0.12;
  var uni = (M && M.universe) || [], bars = (M && M.bars) || {};
  var picks = (M && M.picks && M.picks.syms) || [];
  var pickSet = {}; picks.forEach(function(s){ pickSet[s] = 1; });

  var items = [], skipped = 0;
  uni.forEach(function(sym){
    var st = heatStat(bars[sym], win);
    if(!st || st.dv <= 0){ skipped++; return; }
    items.push({ sym:sym, v:st.dv, r:st.r, c:st.c });
  });
  if(!items.length)
    return '<div class="ht"><div class="ht-head">No price data loaded yet.</div></div>';
  items.sort(function(a, b){ return b.v - a.v; });

  var W = 1000, H = 520;
  var rects = heatSquarify(items, 0, 0, W, H);
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Heat map of the universe by ' + win + '-day return">';
  rects.forEach(function(q){
    var it = q.it, pick = pickSet[it.sym];
    s += '<rect x="' + q.x.toFixed(1) + '" y="' + q.y.toFixed(1) + '" width="' + Math.max(0, q.w - 2).toFixed(1) +
         '" height="' + Math.max(0, q.h - 2).toFixed(1) + '" rx="3" fill="' + heatColor(it.r, cap) + '"' +
         (pick ? ' stroke="#e6edf5" stroke-width="2.5"' : ' stroke="#05070b" stroke-width="1"') + '/>';
    var m = Math.min(q.w, q.h);
    if(m < 26) return;                                   /* a label that does not fit is noise */
    var fs = Math.max(9, Math.min(26, m * 0.27));
    var cx = (q.x + q.w / 2).toFixed(1), cy = q.y + q.h / 2;
    s += '<text x="' + cx + '" y="' + (cy - fs * 0.08).toFixed(1) + '" text-anchor="middle" fill="#f2f7fc" ' +
         'font-size="' + fs.toFixed(1) + '" font-weight="800" letter-spacing="0.5">' + esc(it.sym) + '</text>';
    if(m >= 44)
      s += '<text x="' + cx + '" y="' + (cy + fs * 0.95).toFixed(1) + '" text-anchor="middle" fill="#f2f7fcc4" ' +
           'font-size="' + (fs * 0.62).toFixed(1) + '" font-weight="700">' + heatPct(it.r) + '</text>';
  });
  s += '</svg>';

  var spy = heatStat(bars.SPY, win);
  var up = items.filter(function(i){ return i.r > 0; }).length;
  var head;
  if(spy) head = '<b>SPY is ' + heatPct(spy.r) + ' over ' + win + ' session' + (win > 1 ? 's' : '') + '.</b> ' +
                 up + ' of ' + items.length + ' names are up over the same stretch.';
  else    head = '<b>' + up + ' of ' + items.length + ' names are up over ' + win + ' sessions.</b>';

  var btns = HEAT_WINS.map(function(h){
    return '<button class="mini2' + (h === win ? ' on' : '') + '" data-act="hwin" data-h="' + h + '">' +
           (h === 1 ? '1 DAY' : h + ' DAYS') + '</button>';
  }).join('');

  var pickLine = picks.length
    ? 'Tonight’s picks are outlined in white' +
      (picks.filter(function(p){ return uni.indexOf(p) >= 0; }).length ? '.' :
       ', and none of them is in this map: the picks come from the whole market, this map is the 24 names the app tracks closely.')
    : 'No picks tonight.';

  return '<div class="ht">' +
    '<div class="ht-head">' + head + '</div>' +
    '<div class="ht-sub">Tile size is how many dollars a day actually trade. Colour is the ' + win +
      '-session return, saturating at ' + Math.round(cap * 100) + '%.</div>' +
    '<div class="ht-btns">' + btns + '</div>' + s +
    '<div class="ht-foot">' + pickLine +
      (skipped ? ' ' + skipped + ' name' + (skipped > 1 ? 's have' : ' has') + ' too little history for this window.' : '') +
      '<br>This is what has already happened. Nothing on it is a signal, a rank or a reason to buy.</div>' +
    '</div>';
}

/* ---- the held book -----------------------------------------------------------------------
   The market map answers what the market did. This one answers what Brent's own money is doing,
   and it is the one that should make him act.

   Five slots, because that is what the 1% risk unit and the 5% open-risk cap were sized for on
   2026-11-26. Empty slots are drawn, so the shape of the book is visible rather than implied.

   Colour is the R-multiple: how far the trade has come from its entry, measured in the risk it
   was taken with. R = (price - cost) / (cost - stop). Minus one R is the stop, zero is break
   even, plus two R is a good trade. The same scale as the market map, red bad to blue good, so
   red never means two different things in this app.

   An alert is NOT a colour. A position can be down and fine, or flat with no stop order and be
   an emergency, and those must not be the same shade of anything. Alerts get a bright border and
   a reason printed on the tile. */

var HELD_SLOTS = 5;
var HELD_CAP_PCT = 5.0;          // mirrors sizing.MAX_OPEN_RISK_PCT on Petunia

function heldR(h){
  if(!h.stop || h.cost <= h.stop) return null;      // no stop, or a stop above the entry
  return (h.price - h.cost) / (h.cost - h.stop);
}

function heldColor(r){
  if(r === null) return 'rgb(26,26,26)';
  var t = r < 0 ? Math.max(-1, r) : Math.min(1, r / 2);     // -1R to +2R
  var tgt = t >= 0 ? [91, 140, 255] : [255, 59, 59];        // tron blue, tron red
  var a = Math.pow(Math.abs(t), 0.6);
  var c = [0, 1, 2].map(function(i){ return Math.round(26 + (tgt[i] - 26) * a); });
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}

/* What the tile says is wrong, in the order it matters. Null when nothing is. */
function heldAlert(h, r){
  if(!h.stop) return 'NO STOP ORDER';
  if(r !== null && r <= -0.75) return 'NEAR THE STOP';
  if(h.cost <= h.stop) return 'STOP ABOVE ENTRY';
  return null;
}

function heldInline(held, acct){
  held = (held || []).slice(0, HELD_SLOTS);
  var netLiq = (acct && acct.netLiq) || 0;
  var risk = 0, alerts = 0, unstopped = 0;
  held.forEach(function(h){
    if(h.stop) risk += h.qty * (h.price - h.stop); else unstopped++;
  });
  var budget = netLiq * HELD_CAP_PCT / 100;
  var used = budget > 0 ? Math.min(1, risk / budget) : 0;

  var tiles = '';
  held.forEach(function(h){
    var r = heldR(h), al = heldAlert(h, r);
    if(al) alerts++;
    var at = h.stop ? h.qty * (h.price - h.stop) : h.qty * h.price;
    tiles += '<div class="hd-t' + (al ? ' hd-al' : '') + '" style="background:' + heldColor(r) + '">' +
      '<div class="hd-s">' + esc(h.sym) + '</div>' +
      '<div class="hd-r">' + (r === null ? '&ndash;' : (r >= 0 ? '+' : '−') + Math.abs(r).toFixed(1) + 'R') + '</div>' +
      '<div class="hd-m">$' + at.toFixed(0) + (netLiq ? ' · ' + (at / netLiq * 100).toFixed(1) + '%' : '') +
        (h.stop ? ' at risk' : ' exposed') + '</div>' +
      (al ? '<div class="hd-a">' + al + '</div>' : '') + '</div>';
  });
  for(var i = held.length; i < HELD_SLOTS; i++)
    tiles += '<div class="hd-t hd-e"><div class="hd-s">OPEN</div></div>';

  var head;
  if(!held.length) head = '<b>Nothing open.</b> Five slots, and the whole risk budget is free.';

/* ---- You against SPY ---------------------------------------------------
   The scoreboard. Time-weighted return against SPY bought and held over the
   same two dates, so a deposit or a withdrawal cannot flatter the number.
   Tron blue is ahead of SPY. Tron red is behind. The bar is the spread in
   percentage points, centred on zero, and the number beside it is the truth
   whether or not the bar has run out of room. */
var VS_CAP = 10;                      /* points of spread that fill the bar */
var VS_ORDER = ['wk', 'mo', 'qt', 'al'];
var VS_LABEL = {wk: 'THIS WEEK', mo: 'THIS MONTH', qt: 'THREE MONTHS', al: 'SINCE SEPT 23'};
var VS_EXPECT = {wk: 5, mo: 21, qt: 63};   /* trading days each window asks for */
var VS_STALE_DAYS = 4;                /* past this the panel says how old it is */

function vsColor(sp){
  if(sp === null || isNaN(sp)) return 'rgb(26,26,26)';
  var t = Math.max(-1, Math.min(1, sp / VS_CAP)), e = Math.pow(Math.abs(t), 0.62);
  var a = [26, 26, 26], b = t >= 0 ? [91, 140, 255] : [255, 59, 59];
  return 'rgb(' + a.map(function(c, i){ return Math.round(c + (b[i] - c) * e); }).join(',') + ')';
}
function vsSign(v, d){ return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d === undefined ? 1 : d); }

/* left and width as percentages of a bar whose centre is zero. */
function vsBar(sp){
  var w = 50 * Math.min(1, Math.abs(sp) / VS_CAP);
  return sp >= 0 ? {left: 50, width: w} : {left: 50 - w, width: w};
}

/* Whole days between an ISO date and today, or null if the date is unusable. */
function vsAge(asof){
  if(!asof) return null;
  var t = Date.parse(asof + 'T00:00:00');
  if(isNaN(t)) return null;
  var now = new Date();
  var today = Date.parse(now.toISOString().slice(0, 10) + 'T00:00:00');
  return Math.round((today - t) / 86400000);
}

function vsInline(vs, asof){
  if(!vs || !vs.length)
    return '<div class="vs"><div class="vs-head">No scoreboard yet. It arrives with tonight’s ' +
           'push link, once the run has a day of account history to compare.</div></div>';

  var by = {};
  vs.forEach(function(r){ by[r.code] = r; });

  var all = by.al, head;
  if(all){
    var sp = all.you - all.bench;
    head = '<b style="color:' + (sp >= 0 ? '#5b8cff' : '#ff3b3b') + '">' + vsSign(sp) +
           ' points ' + (sp >= 0 ? 'ahead of' : 'behind') + ' SPY</b> since you started.';
  } else {
    head = '<b>Not enough history yet.</b>';
  }

  var rows = '';
  VS_ORDER.forEach(function(code){
    var r = by[code];
    if(!r){
      rows += '<div class="vs-r"><div class="vs-l">' + VS_LABEL[code] + '</div>' +
              '<div class="vs-b"><i class="vs-z"></i></div>' +
              '<div class="vs-n vs-dim">short</div></div>';
      return;
    }
    var sp = r.you - r.bench, g = vsBar(sp), exp = VS_EXPECT[code];
    var off = (exp && Math.abs(r.days - exp) > 1)
      ? ' <span class="vs-warn">' + r.days + ' trading days, not ' + exp + '</span>' : '';
    rows += '<div class="vs-r">' +
      '<div class="vs-l">' + VS_LABEL[code] + '</div>' +
      '<div class="vs-b"><i class="vs-z"></i>' +
        '<i class="vs-f" style="left:' + g.left.toFixed(1) + '%;width:' + g.width.toFixed(1) +
        '%;background:' + vsColor(sp) + '"></i></div>' +
      '<div class="vs-n" style="color:' + (sp >= 0 ? '#5b8cff' : '#ff3b3b') + '">' + vsSign(sp) + '</div>' +
      '<div class="vs-sub">you ' + vsSign(r.you) + '% · SPY ' + vsSign(r.bench) + '%' + off + '</div>' +
      '</div>';
  });

  /* Kept from the last push, so it can be old. An old spread shown with no date reads as
     today's, which is the one way this panel could make him act on a stale number. */
  var age = vsAge(asof), stale = '';
  if(age !== null && age > VS_STALE_DAYS)
    stale = '<div class="vs-stale">Measured to ' + esc(asof) + ', ' + age +
            ' days ago. Nothing since then is in it.</div>';

  return '<div class="vs">' +
    '<div class="vs-head">' + head + stale + '</div>' +
    '<div class="vs-rows">' + rows + '</div>' +
    '<div class="vs-foot">Your return here is time-weighted, so money you add or take out ' +
    'does not move it. SPY is bought and held between the same two dates. ' +
    'Blue is ahead of SPY and red is behind, which is not the same as up or down: ' +
    'in a falling market you can be blue and still be down money.</div>' +
    '</div>';
}

function candleName(bars,k){

function parseSyms(t){ var seen={}, out=[]; String(t||'').toUpperCase().split(/[^A-Z.\-]+/).forEach(function(x){ if(x && x.length<=6 && !seen[x]){ seen[x]=1; out.push(x); } }); return out.slice(0,3); }

async function buildExt(sym){
  var b=await loadBarsFor(sym), spy=S.bars['SPY'];
  var sp=spy[spy.length-1].c/spy[spy.length-21].c-1, m=metrics(sym,b,sp);
  if(!m) throw new Error('short');
  if(m.date!==(S.mdate||S.date)) throw new Error('stale');
  var z=sizing(m); if(!z) throw new Error('nosize');
  var met=(m.g1==='met')+(m.g2==='met')+(m.g3==='met'), cl=(m.g1==='close')+(m.g2==='close')+(m.g3==='close');

    try{ out.push(await buildExt(syms[i])); }
    catch(e){ var w=(e&&e.message)||''; bad.push(syms[i]+(w==='short'?' (too little history)':w==='nosize'?' (no share count fits your account)':w==='stale'?' (price is not from the latest close)':' (could not read)')); }

}

/* ---------- tonight's picks from the published market file (no link, no typing) ----------
   Symbols only. That file is public, and a share count or risk figure would give the account's
   size away, because the sizing rule risks 3% of net liquidation value per trade. The page sizes
   them here from the account it already holds, so the cards also show real gate results. */
function publishedSyms(){
  var p=MARKET&&MARKET.picks;
  if(!p||!p.syms||!p.syms.length) return [];
  if(p.date!==(S.mdate||MARKET.asof)) return [];   /* never one session's picks beside another's prices */
  return parseSyms(p.syms.join(' '));
}
/* The real account size rides in the push link, never in the published file, which is public.
   Applied before anything is sized, and saved, so later opens without the push use it too. */
async function applyAcct(a){
  if(!a||!(a.netLiq>0)||!(a.cash>=0)) return;
  S.acct={netLiq:a.netLiq,cash:Math.min(a.cash,a.netLiq),sample:false};
  await saveAcct();
}
async function initExt(){
  var hp=pushParse();
  if(hp&&hp.acct) await applyAcct(hp.acct);
  if(hp&&hp.held&&hp.held.length){ S.held=hp.held; S.bookDate=hp.date; }
  if(hp&&hp.vs&&hp.vs.length){ S.vs=hp.vs; S.bookDate=hp.date; }
  if(hp){ await savePush(hp); }
  else { hp=await savedPush(); if(hp&&hp.date!==(S.mdate||MARKET.asof)) hp=null; }   /* no stale saved push */
  if(hp){ applyPush(hp); return; }
  var syms=urlSyms();
  if(!syms.length) syms=publishedSyms();
  if(syms.length){ await saveExt(syms); }
  else if(db){ try{ var d=await db.doc('ext/'+S.date).get(); if(d.exists&&d.data().syms) syms=parseSyms(d.data().syms.join(' ')); }catch(e){} }

}

function scoreOne(pk,bars,spy){
  var i0=-1,j0=-1,i;
  for(i=0;i<bars.length;i++) if(bars[i].d===pk.date){ i0=i; break; }
  for(i=0;i<spy.length;i++) if(spy[i].d===pk.date){ j0=i; break; }
  if(i0<0||j0<0) return null;
  var n=Math.min(bars.length-1-i0, spy.length-1-j0); if(n<1) return null;
  var out={date:pk.date,sym:pk.sym,n:n,final:n>=20,entry:pk.entry};
  [5,10,20].forEach(function(h2){ if(n>=h2){ var r=bars[i0+h2].c/pk.entry-1, s=spy[j0+h2].c/spy[j0].c-1; out['r'+h2]=+(r*100).toFixed(2); out['x'+h2]=+((r-s)*100).toFixed(2); } });
  var W=Math.min(n,20), exit=null, reason='open', hi=-1e9, lo=1e9;
  for(var k=1;k<=W;k++){ var b=bars[i0+k]; hi=Math.max(hi,b.h); lo=Math.min(lo,b.l);
    if(exit===null){ if(b.o<=pk.stop){ exit=b.o; reason='stop'; out.stopDay=k; } else if(b.l<=pk.stop){ exit=pk.stop; reason='stop'; out.stopDay=k; } } }
  if(exit===null){ exit=bars[i0+W].c; reason=(n>=20)?'time':'open'; }
  out.exit=+exit.toFixed(2); out.reason=reason; out.stopHit=(reason==='stop');
  out.mfe=+((hi/pk.entry-1)*100).toFixed(2); out.mae=+((lo/pk.entry-1)*100).toFixed(2);
  out.pl=+((exit-pk.entry)*pk.shares).toFixed(2); out.rMult=pk.risk>0?+(out.pl/pk.risk).toFixed(2):null; out.ts=new Date().toISOString();
  return out;
}
async function scoreAll(){

    var docs=pd.docs.map(function(d){ return d.data(); });
    var todo=[]; docs.forEach(function(x){ (x.picks||[]).forEach(function(pk){ var q=Object.assign({date:x.date},pk), s=done[x.date+'_'+pk.sym]; if((!s||!s.final) && x.date<S.date) todo.push(q); }); });
    var meta=await db.doc('meta/scorer').get(), last=meta.exists?meta.data().date:null, md=S.mdate||S.date;
    if(todo.length && last!==md){

      for(var t=0;t<todo.length;t++){ var q2=todo[t]; if(!bs[q2.sym]) continue; var sc=scoreOne(q2,bs[q2.sym],spy); if(sc){ done[q2.date+'_'+q2.sym]=sc; try{ await db.doc('score/'+q2.date+'_'+q2.sym).set(sc); }catch(e){} } }

}

function spk(vals,color,extra){
  var W=340,H=96,pad=4, v=vals.filter(function(x){return x!==null;}); if(v.length<2) return '';
  var all=v.concat(extra?extra.reduce(function(a,e){return a.concat(e.band?e.band:e.vals.filter(function(x){return x!==null;}));},[]):[]);
  var lo=Math.min.apply(null,all), hi=Math.max.apply(null,all); if(hi===lo) hi=lo+1;
  function path(a){ var d='',n=a.length; for(var i=0;i<n;i++){ if(a[i]===null) continue; d+=(d?'L':'M')+(pad+i*(W-2*pad)/(n-1)).toFixed(1)+' '+(H-pad-(a[i]-lo)/(hi-lo)*(H-2*pad)).toFixed(1); } return d; }
  var o='<svg class="dsvg" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
  (extra||[]).forEach(function(e){ if(e.band){ var y1=H-pad-(e.band[1]-lo)/(hi-lo)*(H-2*pad), y0=H-pad-(e.band[0]-lo)/(hi-lo)*(H-2*pad); o+='<rect x="0" y="'+Math.min(y0,y1).toFixed(1)+'" width="'+W+'" height="'+Math.abs(y0-y1).toFixed(1)+'" fill="'+e.color+'" opacity=".12"/>'; } else o+='<path d="'+path(e.vals)+'" fill="none" stroke="'+e.color+'" stroke-width="1.5" stroke-dasharray="'+(e.dash||'0')+'"/>'; });
  o+='<path d="'+path(vals)+'" fill="none" stroke="'+color+'" stroke-width="2.2"/></svg>'; return o;
}

/* ---------- the tug of war: are my calls good ---------- */
function meterCalls(h){
  var B=board(), key='x'+h, rows=[];
  B.G.bought.concat(B.G.skipped).forEach(function(r){ if(r.sc && r.sc[key]!==undefined){ var x=r.sc[key], buy=(r.dec==='buy'); var lg=null; for(var li=0;li<S.log.length;li++){ if(S.log[li].date===r.date&&S.log[li].sym===r.pk.sym){ lg=S.log[li]; break; } } rows.push({mkt:lg&&lg.mkt?lg.mkt:null,date:r.date,sym:r.pk.sym,buy:buy,x:x,right:buy?(x>0):(x<0),pts:buy?x:-x}); } });
  rows.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:(a.sym<b.sym?-1:1); });
  var n=rows.length, right=rows.filter(function(r){return r.right;}).length, p=n?right/n:0.5, z=1.96, lo=0, hi=1;
  if(n){ var d=1+z*z/n, c=(p+z*z/(2*n))/d, hw=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d; lo=Math.max(0,c-hw); hi=Math.min(1,c+hw); }
  var streak=0; for(var i=rows.length-1;i>=0;i--){ if(rows[i].right) streak++; else break; }
  function grp(buy){ var g=rows.filter(function(r){return r.buy===buy;}); return { n:g.length, right:g.filter(function(r){return r.right;}).length, avg:g.length?g.reduce(function(s2,r){return s2+r.x;},0)/g.length:null }; }
  var all=B.G.all.filter(function(r){ return r.sc && r.sc[key]!==undefined; }), cards=all.length?all.reduce(function(s2,r){return s2+r.sc[key];},0)/all.length:null;

/* E5: the honest limit. One wording, shown under the cards and on the scoreboard. The gate
   stack failed its sealed 2018-2021 hold-out on 2026-10-15 and 26 preregistered premises have

function noEdgeNote(){
  return '<div class="hp-note" style="border-color:#5a3f3f;color:#b9a3a3"><b style="color:#f2b441">NO EDGE PROVEN</b><br>'+
    'The gates failed their out-of-sample test in October, and 26 preregistered premises have been '+

/* Every card is sized on its own to risk about 3% of equity. Nothing on screen said what
   they come to together, which did not matter while only one card carried a lit BUY. Now
   that the slab follows the gates, several cards can be lit at once, and on a small account
   their combined cost can exceed available cash while their combined risk is a multiple of
   one trade. The app does that addition rather than leaving it to the reader. Figures are
   computed at render time and never written into this file, which is published. */
function basketNote(P){
  var a = S.acct;
  if(!a || a.sample || !(a.netLiq > 0)) return '';
  var live = P.filter(function(c){ return c.met === 3 && c.z && c.z.sh > 0 && !decided(c.m.sym); });
  if(live.length < 2) return '';
  var cost = live.reduce(function(t,c){ return t + c.z.cash; }, 0);
  var risk = live.reduce(function(t,c){ return t + c.z.risk; }, 0);
  var each = Math.max.apply(null, live.map(function(c){ return c.z.risk; })) / a.netLiq * 100;
  var all  = risk / a.netLiq * 100;
  var over = cost > a.cash;
  var m = function(v){ return '$' + Math.round(v).toLocaleString(); };
  return '<div class="hp-note" style="margin:0 14px 8px;border-color:' + (over ? '#7a2a2f' : '#3a4658') + '">' +
    '<b style="color:' + (over ? '#ff6a6a' : '#f2b441') + '">' +
      (over ? 'YOU CANNOT TAKE ALL ' + live.length : 'ALL ' + live.length + ' TOGETHER') + '</b><br>' +
    'Together they cost ' + m(cost) + ' against ' + m(a.cash) + ' of cash' +
    (over ? ', short by ' + m(cost - a.cash) + '. ' : '. ') +
    'Each is sized to risk about ' + each.toFixed(1) + '% on its own. All ' + live.length +
    ' would risk ' + all.toFixed(1) + '%, which is ' + (all / each).toFixed(1) + ' times one trade.' +
    '</div>';
}

function pushParse(){

  if(!/^\d{8}-/.test(h)){ var q=''; try{ q=String(location.search||''); }catch(e){} var m=/[?&]h=([^&]+)/.exec(q); h=m?m[1]:''; }
  var t=h.split('-'); if(t.length<5||!/^\d{8}$/.test(t[0])) return null;
  /* Tails, in any order: -f-SYM focuses a card, -a-NETLIQCENTS-CASHCENTS carries the real account
     size, and each -h-SYM-QTY-PRICEC-STOPC-COSTC carries one held position, stop 0 meaning no
     working stop order. Tags are lowercase, so they can never be mistaken for a ticker. */
  var foc=null, acct=null, held=[], vs=[];
  for(;;){
    if(t.length>=7 && t[t.length-6]==='h'){
      var hs=t[t.length-5].replace(/9/g,'.'), hq=+t[t.length-4],
          hp=+t[t.length-3]/100, ht=+t[t.length-2]/100, hc=+t[t.length-1]/100;
      if(/^[A-Z.]{1,6}$/.test(hs)&&hq>=1&&hp>0&&hc>0&&ht>=0&&ht<hp)
        held.push({sym:hs,qty:hq,price:hp,stop:ht||null,cost:hc});
      t=t.slice(0,-6); continue; }
    if(t.length>=6 && t[t.length-5]==='s'){
      /* One scoreboard window. Returns ride as basis points plus 50000 so that a loss carries no
         minus sign, which is the hash's own separator. */
      var vc=t[t.length-4], vy=+t[t.length-3]-50000, vb=+t[t.length-2]-50000, vd=+t[t.length-1];
      if(/^(wk|mo|qt|al)$/.test(vc)&&isFinite(vy)&&isFinite(vb)&&vd>=0&&vd<=9999
         &&Math.abs(vy)<=50000&&Math.abs(vb)<=50000)
        vs.push({code:vc,you:vy/100,bench:vb/100,days:vd});

  else if(act==='meter'){ S.panel='meter'; }
  else if(act==='dial'){ S.dial=t.getAttribute('data-d'); S.panel='dial'; if(!S.bars.SPY){ loadBarsFor('SPY').then(function(){ render(); }).catch(function(){}); } }
  else if(act==='mh'){ S.mh=+t.getAttribute('data-h'); }
  else if(act==='ldgo'){ doLoad(); return; }
  else if(act==='ldclear'){ clearExt(); return; }
  else if(act==='lookup'){ S.panel='lookup'; S.lkErr=''; }
  else if(act==='lkgo'){ var s2=(S.lkText||'').toUpperCase().replace(/[^A-Z.\-]/g,''); if(s2){ doLookup(s2); } return; }
  else if(act==='lk'){ S.panel='lookup'; S.lkText=t.getAttribute('data-s'); doLookup(S.lkText); return; }
  else if(act==='notehere'){ var cc=(S.skipFor!==null?P[S.skipFor]:(S.open!==null?P[S.open]:(S.ticket!==null?P[S.ticket]:null))), tx=S.note.trim(); if(tx){ S.noteText=tx; S.noteSym=cc?cc.m.sym:''; S.note=''; saveNote(true); S.flash='Note saved'; setTimeout(function(){ S.flash=''; render(); },1800); } }
  else if(act==='notesym'){ S.noteSym=(S.noteSym===t.getAttribute('data-s'))?'':t.getAttribute('data-s'); }
  else if(act==='notesave'){ saveNote(); return; }
  else if(act==='saveacct'){ var nl=parseFloat($('nl').value), ca=parseFloat($('ca').value); if(nl>0&&ca>=0){ S.acct={netLiq:nl,cash:Math.min(ca,nl),sample:false}; saveAcct().then(function(){ if(!S.log.some(function(l){ return l.date===S.date; })) ensurePicksDoc(true); }); S.panel=null; } }
  else if(act==='retry'){ S.errors=[]; run(); return; }
  render();
});
window.__AM = { board:board, meterCalls:meterCalls, S:S, picks:picks, candidates:candidates, parseBars:parseBars, metrics:metrics, sizing:sizing, signals:signals, run:run, render:render };
render();
run();
})();
var clResize=null; window.addEventListener('resize',function(){ clearTimeout(clResize); clResize=setTimeout(function(){ if(S.phase==='ready'&&!S.panel) render(); },200); });
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

<script>
/* Amalgam neon backdrop: a perspective floor grid receding to a horizon, plus a few drifting
   motes. One canvas, no library. It is deliberately cheap: capped device pixel ratio, ~30fps,
   stops dead when the tab is hidden, and draws a single static frame for anyone who has asked
   for reduced motion. Remove the html.tron class and none of this runs. */
(function () {
  'use strict';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.createElement('canvas');
  cv.id = 'tron-grid';
  document.body.insertBefore(cv, document.body.firstChild);
  var ctx = cv.getContext('2d', { alpha: false });
  var W = 0, H = 0, dpr = 1, motes = [], streaks = [], t = 0, raf = 0, last = 0;

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    motes = [];
    streaks = [];
    for (var q = 0; q < 18; q++) streaks.push({ p: Math.random(), v: 0.004 + Math.random() * 0.012, k: (Math.random() * 32 | 0) - 16, len: 0.06 + Math.random() * 0.1, hot: Math.random() < 0.22 });
    for (var i = 0; i < 26; i++) motes.push({ x: Math.random() * W, y: Math.random() * H, s: 0.12 + Math.random() * 0.35, r: Math.random() < 0.25 ? 1.6 : 1 });
  }

  function draw() {
    var hz = H * 0.40;
    var drift = Math.sin(t * 0.0016) * (W * 0.04);
    var cxp = W / 2 + drift;
    ctx.fillStyle = '#030406';
    ctx.fillRect(0, 0, W, H);

    // horizon flare, drawn as a gradient rather than a blur filter so it stays cheap and crisp
    var g = ctx.createLinearGradient(0, hz - 110, 0, hz + 26);
    g.addColorStop(0, 'rgba(255,59,59,0)');
    g.addColorStop(0.72, 'rgba(255,59,59,.06)');
    g.addColorStop(1, 'rgba(255,90,70,.20)');
    ctx.fillStyle = g; ctx.fillRect(0, hz - 110, W, 136);
    ctx.strokeStyle = 'rgba(255,120,100,.85)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, hz + .5); ctx.lineTo(W, hz + .5); ctx.stroke();

    // floor rows. p is raised to 2.6 so they bunch hard at the horizon and rush past underfoot
    var rows = 34, off = (t * 0.055) % 1;
    for (var i = 0; i < rows; i++) {
      var p = (i + off) / rows;
      var y = hz + (H - hz) * Math.pow(p, 2.6);
      if (y > H) continue;
      var a = 0.04 + 0.42 * p * p;
      ctx.strokeStyle = 'rgba(255,59,59,' + a.toFixed(3) + ')';
      ctx.lineWidth = p > 0.78 ? 1.6 : 1;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.lineWidth = 1;

    // rails fanning out of the vanishing point
    for (var k = -16; k <= 16; k++) {
      var ra = 0.26 - Math.abs(k) * 0.012;
      if (ra <= 0) continue;
      ctx.strokeStyle = 'rgba(255,59,59,' + ra.toFixed(3) + ')';
      ctx.beginPath(); ctx.moveTo(cxp + k * 4, hz); ctx.lineTo(cxp + k * (W / 5), H); ctx.stroke();
    }

    // speed lines: short streaks riding the rails outward, the thing that reads as velocity
    for (var s = 0; s < streaks.length; s++) {
      var st = streaks[s];
      var sp1 = Math.pow(st.p, 2.6), sp2 = Math.pow(Math.max(0, st.p - st.len), 2.6);
      var y1 = hz + (H - hz) * sp1, y2 = hz + (H - hz) * sp2;
      var x1 = cxp + st.k * 4 + (st.k * (W / 5) - st.k * 4) * sp1;
      var x2 = cxp + st.k * 4 + (st.k * (W / 5) - st.k * 4) * sp2;
      ctx.strokeStyle = 'rgba(255,' + (st.hot ? '170,120' : '70,60') + ',' + (0.1 + 0.75 * st.p).toFixed(3) + ')';
      ctx.lineWidth = st.hot ? 2 : 1.3;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      st.p += st.v; if (st.p > 1.08) { st.p = 0; st.k = (Math.random() * 32 | 0) - 16; st.hot = Math.random() < 0.22; }
    }
    ctx.lineWidth = 1;

    // ceiling, amber and sparse, so the frame reads as a canopy and not a floor alone
    for (var j = 0; j < 12; j++) {
      var q = (j + off) / 12, yy = hz - hz * Math.pow(q, 2.4);
      ctx.strokeStyle = 'rgba(242,180,65,' + (0.02 + 0.12 * q * q).toFixed(3) + ')';
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
    }
    for (var n = 0; n < motes.length; n++) {
      var m = motes[n];
      ctx.fillStyle = m.r > 1 ? 'rgba(242,180,65,.55)' : 'rgba(255,59,59,.5)';
      ctx.fillRect(m.x, m.y, m.r, m.r);
      m.y -= m.s; if (m.y < 0) { m.y = H; m.x = Math.random() * W; }
    }
  }

  function loop(now) {
    raf = requestAnimationFrame(loop);
    if (now - last < 24) return;                          // about 40fps, the motion needs it
    if (!document.documentElement.classList.contains('tron')) return;   // layer off: idle, draw nothing
    last = now; t += 1; draw();
  }

  function start() { if (!raf && !reduce) { last = 0; raf = requestAnimationFrame(loop); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

  var canopy = document.createElement('div');
  canopy.id = 'tron-canopy';
  document.body.appendChild(canopy);

  size(); draw();
  if (!reduce) start();
  window.addEventListener('resize', function () { size(); draw(); }, { passive: true });
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
})();

</script>
