async function fetchBars(sym,iv,size){
  for(var attempt=0; attempt<4; attempt++){
    var win = TEST.win||61000, now=Date.now();
    calls = calls.filter(function(t){ return now-t<win; });
    if(calls.length>=1e9){ await sleep(win-(now-calls[0])+300); }
    calls.push(Date.now());
    try{
      var r = await mcp.callTool(SERVER,'get_time_series',{symbol:sym,interval:iv||'1day',outputsize:size||260},{cache:false});
      var bars = findBars(r);
      if(bars && bars.length) return bars;
      var txt = shape(r); if(/limit|credit|minute/i.test(txt)){ await sleep(TEST.retry||20000); continue; }

    }catch(e){

  function mark(sym,k){ var s=(S.seen[sym]||[false,false,false]).slice(); s[k]=true; S.seen[sym]=s; }
  if(act==='buy'){ c=P[i]; var sn=S.seen[c.m.sym]||[false,false,false]; if(sn[0]&&sn[1]&&sn[2]){ S.ticket=i; } else { var k=sn.indexOf(false); mark(c.m.sym,k); S.open=i; S.step=k; S.note=''; } }
  else if(act==='skip'){ S.skipFor=i; S.note=''; S.flash=''; }
  else if(act==='close'){ S.open=null; }
  else if(act==='step'){ c=P[S.open]; mark(c.m.sym,i); S.step=i; }
  else if(act==='main'){ c=P[S.open]; var s2=S.seen[c.m.sym]||[false,false,false]; if(s2[0]&&s2[1]&&s2[2]){ S.ticket=S.open; S.open=null; } else { var k2=s2.indexOf(false); mark(c.m.sym,k2); S.step=k2; } }
  else if(act==='skipopen'){ S.skipFor=S.open; S.open=null; }
  else if(act==='skipclose'){ S.skipFor=null; }
  else if(act==='why'){ c=P[S.skipFor]; record(c,'skip',t.getAttribute('data-w'),S.note.trim()); return; }
  else if(act==='tback'){ S.open=S.ticket; S.step=2; S.ticket=null; }
  else if(act==='confirm'){ c=P[S.ticket]; record(c,'buy','',S.note.trim()); return; }
  else if(act==='cmppick'){ var cp=P[i]; if(cp){ var cs=(S.seen[cp.m.sym]||[false,false,false]).slice(); cs[0]=true; S.seen[cp.m.sym]=cs; S.panel=null; S.open=i; S.step=0; S.note=''; } }
  else if(act==='cmp'||act==='math'||act==='log'||act==='acct'||act==='score'){ S.panel=act; if(act==='cmp') recordCompare(); }
  else if(act==='pclose'){ S.panel=null; }
  else if(act==='chart'){ openChart(P[i].m.sym); return; }
  else if(act==='cclose'){ S.chart=null; }
  else if(act==='tf'){ S.tf=t.getAttribute('data-t'); S.chartErr=''; if(S.tf!=='D'){ var sy=S.chart; render(); loadIntra(sy,S.tf).then(render); return; } }
  else if(act==='crange'){ S.crange=+t.getAttribute('data-r'); }
  else if(act==='csv'){ exportCsv(); return; }
  else if(act==='csvcopy'){ copyCsv(); return; }
  else if(act==='note'){ S.panel='note'; }
  else if(act==='loadp'){ S.panel='load'; }
  else if(act==='meter'){ S.panel='meter'; }
  else if(act==='dial'){ S.dial=t.getAttribute('data-d'); S.panel='dial'; if(!S.bars.SPY){ loadBarsFor('SPY').then(function(){ render(); }).catch(function(){}); } }
  else if(act==='mh'){ S.mh=+t.getAttribute('data-h'); }
  else if(act==='ldgo'){ doLoad(); return; }
  else if(act==='ldclear'){ clearExt(); return; }
  else if(act==='lookup'){ S.panel='lookup'; S.lkErr=''; }
  else if(act==='lkgo'){ var s2=(S.lkText||'').toUpperCase().replace(/[^A-Z.\-]/g,''); if(s2){ doLookup(s2); } return; }
  else if(act==='lk'){ S.panel='lookup'; S.lkText=t.getAttribute('data-s'); doLookup(S.lkText); return; }
  else if(act==='notehere'){ var cc=(S.skipFor!==null?P[S.skipFor]:(S.open!==null?P[S.open]:(S.ticket!==null?P[S.ticket]:null))), tx=S.note.trim(); if(tx){ S.noteText=tx; S.noteSym=cc?cc.m.sym:''; S.note=''; saveNote(true); S.flash='Note saved'; setTimeout(function(){ S.flash=''; render(); },1800); } }
  else if(act==='notesym'){ S.noteSym=(S.noteSym===t.getAttribute('data-s'))?'':t.getAttribute('data-s'); }
  else if(act==='notesave'){ saveNote(); return; }
  else if(act==='saveacct'){ var nl=parseFloat($('nl').value), ca=parseFloat($('ca').value); if(nl>0&&ca>=0){ S.acct={netLiq:nl,cash:Math.min(ca,nl),sample:false}; saveAcct().then(function(){ if(!S.log.some(function(l){ return l.date===S.date; })) ensurePicksDoc(true); }); S.panel=null; } }
  else if(act==='retry'){ S.errors=[]; run(); return; }
  render();
});
window.__AM = { board:board, meterCalls:meterCalls, S:S, picks:picks, candidates:candidates, parseBars:parseBars, metrics:metrics, sizing:sizing, signals:signals, run:run, render:render };
render();
run();
})();
var clResize=null; window.addEventListener('resize',function(){ clearTimeout(clResize); clResize=setTimeout(function(){ if(S.phase==='ready'&&!S.panel) render(); },200); });
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
