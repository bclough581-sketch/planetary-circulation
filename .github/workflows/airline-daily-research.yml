name: airline-daily-research
on:
  push:
    branches: [amalgam-event-foundation]
    paths: ['intelligence/airline_daily_study.py', 'intelligence/data/airline-daily-study.json', 'tests/test_airline_daily_study.py', '.github/workflows/airline-daily-research.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_airline_daily_study.py' -v
      - name: Collect daily fuel observations for the draft short-horizon study
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m intelligence.airline_daily_study --start 2014-01-01 --end 2025-12-31 --output-dir daily-study
      - uses: actions/upload-artifact@v4
        with:
          name: amalgam-airline-daily-${{ github.run_id }}
          path: daily-study/
          retention-days: 30
