name: Ring Engine Checks
on:
  pull_request:
    branches: [amalgam-event-foundation, main]
    paths:
      - 'ring-engine-lab.html'
      - 'index.html'
      - 'map.html'
      - 'sw.js'
      - 'scoreboard.html'
      - 'scoreboard.json'
      - 'tests/test_scoreboard.js'
      - 'tests/test_nav_smoke.cjs'
      - 'tests/test_offline_entry.cjs'
      - 'ring-evidence.js'
      - 'amalgam-theme.css'
      - 'galaxy-ring.svg'
      - 'decision-journal.html'
      - 'journal-core.js'
      - 'tests/browser_preview.cjs'
      - 'tests/test_journal_*.cjs'
      - 'tests/test_evidence_handoff.cjs'
      - 'tests/test_ring_*.cjs'
      - 'scripts/build_ring_evidence.py'
      - 'intelligence/events.py'
      - 'intelligence/ingest.py'
      - 'intelligence/data/delta-quarterly-curated.json'
      - 'data.json'
      - 'tests/test_ring_*.py'
      - '.github/workflows/ring-engine-checks.yml'
  push:
    branches: [amalgam-event-foundation]
    paths:
      - 'ring-engine-lab.html'
      - 'index.html'
      - 'map.html'
      - 'sw.js'
      - 'scoreboard.html'
      - 'scoreboard.json'
      - 'tests/test_scoreboard.js'
      - 'tests/test_nav_smoke.cjs'
      - 'tests/test_offline_entry.cjs'
      - 'ring-evidence.js'
      - 'amalgam-theme.css'
      - 'galaxy-ring.svg'
      - 'decision-journal.html'
      - 'journal-core.js'
      - 'tests/browser_preview.cjs'
      - 'tests/test_journal_*.cjs'
      - 'tests/test_evidence_handoff.cjs'
      - 'tests/test_ring_*.cjs'
      - 'scripts/build_ring_evidence.py'
      - 'intelligence/data/delta-quarterly-curated.json'
      - 'tests/test_ring_starter.py'
      - 'intelligence/events.py'
      - 'intelligence/ingest.py'
      - 'scripts/export_ring_snapshot.py'
      - 'data.json'
      - 'tests/test_evidence_export.py'
      - 'tests/generate_evidence_fixture.py'
      - 'tests/test_ring_engine.cjs'
      - 'tests/test_ring_browser.cjs'
      - '.github/workflows/ring-engine-checks.yml'
  workflow_dispatch:
jobs:
  ring-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_ring_engine.cjs
      - run: node tests/test_journal_core.cjs
      - run: node tests/test_journal_regression.cjs
      - run: node tests/test_scoreboard.js
      - run: python -m unittest discover -s tests -p test_ring_starter.py
      - run: python -m unittest discover -s tests -p test_evidence_export.py
  ring-mobile-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: apt-get update -qq && apt-get install -y -qq python3
      - run: PYTHONPATH=. python3 tests/generate_evidence_fixture.py > tests/generated-evidence-fixture.json
      - run: PYTHONPATH=. python3 scripts/export_ring_snapshot.py data.json tests/generated-ring-snapshot.json
      - run: node tests/test_ring_browser.cjs
      - run: node tests/test_journal_browser.cjs
      - run: node tests/test_journal_regression_browser.cjs
      - run: node tests/test_nav_smoke.cjs
      - run: node tests/test_offline_entry.cjs
      - run: node tests/test_evidence_handoff.cjs
      - run: node tests/test_ring_comparisons.cjs
      - run: node tests/test_ring_galaxy.cjs
      - run: node tests/test_ring_theme.cjs
