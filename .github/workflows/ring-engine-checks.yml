name: Ring Engine Checks
on:
  push:
    branches: [amalgam-event-foundation]
    paths:
      - 'ring-engine-lab.html'
      - 'tests/test_ring_engine.cjs'
      - 'tests/test_ring_browser.cjs'
      - '.github/workflows/ring-engine-checks.yml'
  workflow_dispatch:
jobs:
  ring-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_ring_engine.cjs
  ring-mobile-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node tests/test_ring_browser.cjs
