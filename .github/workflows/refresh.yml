name: refresh-data
on:
  schedule:
    - cron: "10 22 * * *"      # daily, about 4:10 PM Central
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch open data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python fetch_data.py
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data refresh $(date -u +%F)"
          git push
