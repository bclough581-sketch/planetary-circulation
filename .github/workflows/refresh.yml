name: refresh-data
on:
  schedule:
    - cron: "10 22 * * *"      # daily, about 4:10 PM Central
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["fetch_data.py", "check_data.py", "alert.py", "tests/**", ".github/workflows/refresh.yml"]
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Fetch permitted market data (PortWatch paused)
        id: fetch
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python fetch_data.py
      - name: Self-check the numbers
        id: check
        run: python check_data.py
      - name: Commit if changed
        if: steps.fetch.outcome == 'success' && steps.check.outcome == 'success'
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add data.json tic.json
          git diff --cached --quiet || git commit -m "data refresh $(date -u +%F)"
          # Fail on concurrent updates; never rebase stale generated data over a newer main.
          git push
      - name: Phone alert if something needs a look
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TESTS: ${{ steps.tests.outcome }}
          FETCH: ${{ steps.fetch.outcome }}
          CHECK: ${{ steps.check.outcome }}
        run: python alert.py
