name: intelligence-energy-research
on:
  push:
    branches: [amalgam-event-foundation]
    paths: ['.github/workflows/energy-research.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fetch-energy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amalgam-event-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test freshness acceptance and rejection
        run: python -m unittest tests.test_eia_research_snapshot
      - name: Fetch current EIA data without altering production snapshot
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m intelligence.eia_research_snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: amalgam-eia-research
          path: eia-research-snapshot.json
          retention-days: 7
