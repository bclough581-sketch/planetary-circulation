name: Amalgam research validation
on:
  push:
    branches:
      - amalgam-event-foundation
  pull_request:
    paths:
      - "intelligence/**"
      - "tests/**"
      - "convergence-research.html"
      - ".github/workflows/amalgam-research-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python regression suite
        run: python -m unittest discover -s tests -v
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run browser research viewer regression suite
        run: node tests/test_research_viewer.cjs
